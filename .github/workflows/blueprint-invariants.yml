name: Blueprint theme invariants

# Runs the Blueprint theme-invariant guardrails (tests/visual/blueprint-invariants.spec.mjs)
# against a deployed URL. These assert brand colors, icon rendering, and that no
# legacy pt-/bp4- elements render unstyled — encoding the styling-audit findings
# (docs/blueprint-migration-styling-audit.md) so the Blueprint migration can't
# silently regress.
#
# Triggers:
#   - workflow_dispatch: run manually against any URL.
#   - workflow_call:      invoke from preview.yml after a preview deploy, e.g.
#       jobs:
#         invariants:
#           needs: deploy
#           uses: ./.github/workflows/blueprint-invariants.yml
#           with:
#             base_url: ${{ needs.deploy.outputs.preview_url }}
#
# It targets a running app (no Rails boot here), so it's cheap — which is why the
# heavier screenshot-diff suite is kept manual.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to test (e.g. a preview deploy URL)
        required: true
        type: string
  workflow_call:
    inputs:
      base_url:
        description: Base URL to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GALA_BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for target to respond
        run: |
          echo "Target: ${GALA_BASE_URL}"
          for i in $(seq 1 30); do
            if curl --fail --silent --location --max-time 10 "${GALA_BASE_URL}" >/dev/null; then
              echo "Target is responding."; exit 0
            fi
            echo "Attempt ${i}: not ready, retrying..."; sleep 5
          done
          echo "Target did not respond in time."; exit 1

      - name: Run Blueprint theme invariants
        run: pnpm test:invariants

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-invariants-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
