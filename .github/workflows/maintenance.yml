name: Maintenance AWS

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Target stage
        required: true
        default: production
        type: choice
        options:
          - dev
          - production
      operation:
        description: Maintenance operation
        required: true
        default: rails_cache_clear
        type: choice
        options:
          - migrate
          - one_off
          - rails_cache_clear
          - cloudfront_invalidate
          - both
      one_off_task:
        description: Allowlisted one-off task when operation is one_off
        required: false
        default: refresh_indices
        type: choice
        options:
          - refresh_indices
          - weekly_report
      cloudfront_paths:
        description: CloudFront invalidation path scope
        required: false
        default: "/*"
        type: string
      dry_run:
        description: Print side effects without mutation
        required: true
        default: true
        type: boolean
      confirmation:
        description: Type "maintenance production <operation>" for production mutation
        required: false
        default: ""
        type: string

concurrency:
  group: gala-${{ github.event.inputs.stage }}-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.stage }}
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: ${{ github.event.inputs.stage }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Validate maintenance operator
        env:
          OPERATOR_ACTOR: ${{ github.triggering_actor }}
          STAGE: ${{ github.event.inputs.stage }}
          OPERATION: ${{ github.event.inputs.operation }}
          CLOUDFRONT_PATHS: ${{ github.event.inputs.cloudfront_paths }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          set -euo pipefail
          source scripts/ops/operator-common.sh

          operator_reject_secret_like_input cloudfront_paths "${CLOUDFRONT_PATHS}"
          if [[ "${STAGE}" == "production" ]]; then
            operator_require_codeowner_actor "${OPERATOR_ACTOR}"
          fi
          operator_require_confirmation "${STAGE}" maintenance "${OPERATION}" "${DRY_RUN}" "${CONFIRMATION}"

      - name: Run maintenance operation
        env:
          OPERATION: ${{ github.event.inputs.operation }}
          ONE_OFF_TASK: ${{ github.event.inputs.one_off_task }}
          CLOUDFRONT_PATHS: ${{ github.event.inputs.cloudfront_paths }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          source scripts/ops/operator-common.sh

          operator_summary "## Maintenance AWS"
          operator_summary ""
          operator_summary "- Stage: ${SST_STAGE}"
          operator_summary "- Operation: ${OPERATION}"
          operator_summary "- Dry run: ${DRY_RUN}"
          operator_summary "- Rails execution boundary: ECS one-off task using the production app image and AWS environment"

          run_migration() {
            operator_summary "### Migration"
            operator_run_ecs_task_from_outputs migration "" "${DRY_RUN}"
          }

          run_one_off() {
            local command_json
            case "${ONE_OFF_TASK}" in
              refresh_indices)
                command_json="$(jq -cn '["bundle","exec","rake","indices:refresh"]')"
                ;;
              weekly_report)
                command_json="$(jq -cn '["bundle","exec","rake","emails:send_weekly_report"]')"
                ;;
              *)
                echo "Unsupported one_off_task: ${ONE_OFF_TASK}" >&2
                exit 1
                ;;
            esac

            operator_summary "### One-off task: ${ONE_OFF_TASK}"
            operator_run_ecs_task_from_outputs migration "${command_json}" "${DRY_RUN}"
          }

          run_rails_cache_clear() {
            local command_json
            command_json="$(jq -cn '["bundle","exec","rails","runner","Rails.cache.clear"]')"
            operator_summary "### Rails cache clear"
            operator_run_ecs_task_from_outputs migration "${command_json}" "${DRY_RUN}"
          }

          run_cloudfront_invalidate() {
            operator_summary "### CloudFront invalidation"
            operator_invalidate_cloudfront_outputs "${CLOUDFRONT_PATHS}" "${DRY_RUN}"
          }

          case "${OPERATION}" in
            migrate)
              run_migration
              ;;
            one_off)
              run_one_off
              ;;
            rails_cache_clear)
              run_rails_cache_clear
              ;;
            cloudfront_invalidate)
              run_cloudfront_invalidate
              ;;
            both)
              run_rails_cache_clear
              run_cloudfront_invalidate
              ;;
            *)
              echo "Unsupported operation: ${OPERATION}" >&2
              exit 1
              ;;
          esac

      - name: Maintenance summary
        if: always()
        run: |
          {
            echo "## Maintenance AWS"
            echo
            echo "- Stage: ${{ github.event.inputs.stage }}"
            echo "- Operation: ${{ github.event.inputs.operation }}"
            echo "- Dry run: ${{ github.event.inputs.dry_run }}"
            echo "- CloudFront paths: ${{ github.event.inputs.cloudfront_paths }}"
            echo "- Verify: ECS task status/logs, Rails behavior, CloudFront invalidation status when used"
          } >> "$GITHUB_STEP_SUMMARY"
