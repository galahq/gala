name: ci
run-name: "ci #${{ github.event.pull_request.number || github.run_number }} @ ${{ github.event.pull_request.head.sha || github.sha }}"

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  statuses: write
  actions: read
  id-token: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gala_test
          POSTGRES_USER: gala
          POSTGRES_PASSWORD: alpine
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      CI_VALIDATION_DIR: tmp/ci-validation
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: dev
      RAILS_ENV: test
      DATABASE_URL: postgres://gala:alpine@127.0.0.1:5432/gala_test
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
      SYSTEM_SMOKE_URL: ${{ vars.GALA_CI_SMOKE_URL }}
      GALA_SMOKE_READER_EMAIL: ${{ secrets.GALA_SMOKE_READER_EMAIL }}
      GALA_SMOKE_READER_PASSWORD: ${{ secrets.GALA_SMOKE_READER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system packages required for Ruby gems
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libmagickcore-dev \
            libmagickwand-dev \
            libffi-dev \
            libvips \
            libssl-dev \
            postgresql-common

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.3
          bundler-cache: true

      - name: Prepare validation directory
        run: mkdir -p "${CI_VALIDATION_DIR}"

      - name: Post pending advisory status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/post-commit-status.mjs \
            --state pending \
            --target-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --description "ci running"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Optionally configure AWS for SST evidence
        if: ${{ vars.GALA_CI_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GALA_CI_AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Collect suite and SST evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CI_VALIDATION_DIR}"
          : > "${CI_VALIDATION_DIR}/suite-results.jsonl"

          append_suite() {
            local category="$1"
            local name="$2"
            local command="$3"
            local status="$4"
            local reason="$5"
            local summary="$6"
            local artifact="$7"
            local duration_ms="$8"
            local exit_code="$9"
            local timed_out="${10}"
            local triage="${11}"
            CATEGORY="$category" NAME="$name" COMMAND="$command" STATUS="$status" REASON="$reason" SUMMARY="$summary" ARTIFACT="$artifact" DURATION_MS="$duration_ms" EXIT_CODE="$exit_code" TIMED_OUT="$timed_out" TRIAGE="$triage" \
              node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const record = {
            category: process.env.CATEGORY,
            name: process.env.NAME,
            command: process.env.COMMAND,
            status: process.env.STATUS,
            reason: process.env.REASON,
            summary: process.env.SUMMARY,
            artifact: process.env.ARTIFACT,
            durationMs: Number(process.env.DURATION_MS || 0),
            exitCode: Number(process.env.EXIT_CODE || 0),
            timedOut: process.env.TIMED_OUT === 'true',
            triage: process.env.TRIAGE,
          };
          fs.appendFileSync(`${process.env.CI_VALIDATION_DIR}/suite-results.jsonl`, `${JSON.stringify(record)}\n`);
          NODE
          }

          extract_failure_lines() {
            local artifact="$1"
            local failures

            failures="$(grep -E -n '(^[[:space:]]*[0-9]+\))|(^[[:space:]]*Failures:)|(^[[:space:]]*Failure/Error:)|(^[[:space:]]*NoEnvironmentInSchemaError)|(^[[:space:]]*PG::)|(^[[:space:]]*ActiveRecord::)|(^[[:space:]]*uninitialized constant)|(^[[:space:]]*undefined method)|(^[[:space:]]*RuntimeError)|(^[[:space:]]*# spec/.+_spec\.rb:[0-9]+:)|(^[[:space:]]*rspec .*\/spec\/.+_spec\.rb:[0-9]+)|(^[[:space:]]*\/.+(spec|app)\/.+\.rb:[0-9]+)' "$artifact" 2>/dev/null \
              | tail -n 12 \
              | sed -E 's/^[0-9]+://' \
              | sed -E 's/[[:space:]]+/ /g')"

            if [[ -n "$failures" ]]; then
              printf '%s' "$failures"
              return
            fi

            tail -n 12 "$artifact" | sed -E 's/[[:space:]]+/ /g'
          }

          run_suite() {
            local category="$1"
            local name="$2"
            local command="$3"
            local timeout_seconds="${4:-240}"
            local failure_status="${5:-failed}"
            local artifact="${CI_VALIDATION_DIR}/${category}.log"
            local start end exit_code status reason summary timed_out triage
            start="$(date +%s%3N)"
            set +e
            timeout "${timeout_seconds}s" bash -lc "$command" > "$artifact" 2>&1
            exit_code=$?
            set -e
            end="$(date +%s%3N)"
            if [[ "$exit_code" -eq 0 ]]; then
              status="passed"
              reason=""
              timed_out="false"
              triage="passed"
            elif [[ "$exit_code" -eq 124 ]]; then
              status="${failure_status}"
              reason="timeout after ${timeout_seconds}s"
              timed_out="true"
              triage="suite timed out; inspect ${artifact} and rerun: ${command}"
            else
              status="${failure_status}"
              reason="exit ${exit_code}"
              timed_out="false"
              triage="non-zero exit; inspect ${artifact} and rerun: ${command}"
            fi
            if [[ "$status" == "passed" ]]; then
              summary="passed"
            else
              summary="$(extract_failure_lines "$artifact" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-320)"
            fi
            append_suite "$category" "$name" "$command" "$status" "$reason" "$summary" "$artifact" "$((end - start))" "$exit_code" "$timed_out" "$triage"
          }

          run_suite unit "ci suite tests" "node --test scripts/ci/*.test.mjs" 120
          run_suite integration "rspec (all non-feature specs)" "bundle exec rails assets:precompile && bundle exec rails db:prepare && bundle exec rspec --exclude-pattern 'spec/features/**/*_spec.rb' --format progress --color" 1200
          run_suite lint_ruby "Ruby lint" "bundle exec rubocop --fail-level error" 300
          run_suite lint_eslint "JavaScript lint" "pnpm exec eslint app/javascript" 300
          run_suite lint_style "Styles lint" "pnpm exec stylelint \"app/assets/stylesheets/**/*.scss\" \"app/assets/stylesheets/**/*.css\"" 300
          run_suite lint_factory "factory_bot lint" "bundle exec rake factory_bot:lint" 180
          run_suite integration_frontend "node tests" "pnpm test" 300
          if [[ -n "${SYSTEM_SMOKE_URL:-}" && -n "${GALA_SMOKE_READER_EMAIL:-}" && -n "${GALA_SMOKE_READER_PASSWORD:-}" ]]; then
            run_suite system "Playwright auth catalog smoke" "pnpm exec playwright install --with-deps chromium && PLAYWRIGHT_BASE_URL=\"${SYSTEM_SMOKE_URL}\" PLAYWRIGHT_OUTPUT_DIR=\"${CI_VALIDATION_DIR}/playwright-smoke-results\" PLAYWRIGHT_HTML_REPORT=\"${CI_VALIDATION_DIR}/playwright-smoke-report\" pnpm test:smoke" 600
          else
            printf '%s\n' "GALA_CI_SMOKE_URL, GALA_SMOKE_READER_EMAIL, and GALA_SMOKE_READER_PASSWORD are required for Playwright auth catalog smoke." > "${CI_VALIDATION_DIR}/system.log"
            append_suite system "Playwright auth catalog smoke" "PLAYWRIGHT_BASE_URL=<target-url> pnpm test:smoke" "not_run" "system smoke URL or credentials not configured" "Playwright auth catalog smoke is not run in CI until GALA_CI_SMOKE_URL and smoke reader secrets are configured." "${CI_VALIDATION_DIR}/system.log" 0 0 false "configure GALA_CI_SMOKE_URL plus GALA_SMOKE_READER_EMAIL and GALA_SMOKE_READER_PASSWORD"
          fi

          SST_REFRESH_STATUS="not_run"
          SST_REFRESH_REASON="AWS credentials or dev SST stage unavailable"
          SST_REFRESH_SUMMARY="not run"
          SST_REFRESH_ARTIFACT="${CI_VALIDATION_DIR}/sst-refresh.log"
          SST_DIFF_STATUS="not_run"
          SST_DIFF_REASON="AWS credentials or dev SST stage unavailable"
          SST_DIFF_SUMMARY="not run"
          SST_DIFF_ARTIFACT="${CI_VALIDATION_DIR}/sst-diff.json"

          if [[ "${AWS_REGION}" == "us-west-2" && "${SST_STAGE}" == "dev" && -n "${AWS_ACCESS_KEY_ID:-}${AWS_WEB_IDENTITY_TOKEN_FILE:-}" ]]; then
            set +e
            (cd infra && timeout 180s npx sst refresh --stage dev) > "${SST_REFRESH_ARTIFACT}" 2>&1
            refresh_exit=$?
            (cd infra && timeout 180s npx sst diff --stage dev --json) > "${SST_DIFF_ARTIFACT}" 2>&1
            diff_exit=$?
            set -e
            if [[ "$refresh_exit" -eq 0 ]]; then SST_REFRESH_STATUS="passed"; SST_REFRESH_REASON=""; elif [[ "$refresh_exit" -eq 124 ]]; then SST_REFRESH_STATUS="warning"; SST_REFRESH_REASON="sst refresh timed out after 180s"; else SST_REFRESH_STATUS="warning"; SST_REFRESH_REASON="sst refresh exited ${refresh_exit}"; fi
            if [[ "$diff_exit" -eq 0 ]]; then SST_DIFF_STATUS="passed"; SST_DIFF_REASON=""; elif [[ "$diff_exit" -eq 124 ]]; then SST_DIFF_STATUS="warning"; SST_DIFF_REASON="sst diff timed out after 180s"; else SST_DIFF_STATUS="warning"; SST_DIFF_REASON="sst diff exited ${diff_exit}"; fi
            SST_REFRESH_SUMMARY="$(tail -n 8 "${SST_REFRESH_ARTIFACT}" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-220)"
            SST_DIFF_SUMMARY="$(tail -n 8 "${SST_DIFF_ARTIFACT}" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-220)"
          else
            printf '%s\n' "${SST_REFRESH_REASON}" > "${SST_REFRESH_ARTIFACT}"
            printf '%s\n' "${SST_DIFF_REASON}" > "${SST_DIFF_ARTIFACT}"
          fi

          COMMIT_SUMMARY=""
          if [[ -n "${PR_HEAD_SHA:-}" ]] && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            COMMIT_SUMMARY="$(git log -1 --pretty=%s "${PR_HEAD_SHA}")"
          fi
          if [[ -z "${COMMIT_SUMMARY}" ]]; then
            COMMIT_SUMMARY="$(git log -1 --pretty=%s HEAD 2>/dev/null || true)"
          fi
          COMMIT_SUMMARY="${COMMIT_SUMMARY:-${PR_TITLE:-No commit summary available}}"
          if [[ -n "${PR_BASE_SHA:-}" && -n "${PR_HEAD_SHA:-}" ]] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            COMMIT_COUNT="$(git rev-list --count "${PR_BASE_SHA}..${PR_HEAD_SHA}" 2>/dev/null || echo 1)"
            SHORTSTAT="$(git diff --shortstat "${PR_BASE_SHA}...${PR_HEAD_SHA}" 2>/dev/null || true)"
            CHANGED_FILES="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" 2>/dev/null || true)"
          else
            COMMIT_COUNT="$(git rev-list --count HEAD ^origin/main 2>/dev/null || echo 1)"
            SHORTSTAT="$(git diff --shortstat origin/main...HEAD 2>/dev/null || true)"
            CHANGED_FILES="$(git diff --name-only origin/main...HEAD 2>/dev/null || true)"
          fi
          CONTRIBUTORS="$(git log --format='%an <%ae>' -n 25 | sort -u | paste -sd ',' -)"
          FILES_CHANGED="$(printf '%s\n' "${SHORTSTAT}" | sed -nE 's/.* ([0-9]+) files? changed.*/\1/p')"
          ADDITIONS="$(printf '%s\n' "${SHORTSTAT}" | sed -nE 's/.* ([0-9]+) insertions?\(\+\).*/\1/p')"
          DELETIONS="$(printf '%s\n' "${SHORTSTAT}" | sed -nE 's/.* ([0-9]+) deletions?\(-\).*/\1/p')"
          FILES_CHANGED="${FILES_CHANGED:-0}"
          ADDITIONS="${ADDITIONS:-0}"
          DELETIONS="${DELETIONS:-0}"
          CHANGED_FILES="${CHANGED_FILES:-}"

          SST_REFRESH_STATUS="${SST_REFRESH_STATUS}" SST_REFRESH_REASON="${SST_REFRESH_REASON}" SST_REFRESH_SUMMARY="${SST_REFRESH_SUMMARY}" SST_REFRESH_ARTIFACT="${SST_REFRESH_ARTIFACT}" \
          SST_DIFF_STATUS="${SST_DIFF_STATUS}" SST_DIFF_REASON="${SST_DIFF_REASON}" SST_DIFF_SUMMARY="${SST_DIFF_SUMMARY}" SST_DIFF_ARTIFACT="${SST_DIFF_ARTIFACT}" \
          COMMIT_SUMMARY="${COMMIT_SUMMARY}" COMMIT_COUNT="${COMMIT_COUNT}" CONTRIBUTORS="${CONTRIBUTORS}" FILES_CHANGED="${FILES_CHANGED}" ADDITIONS="${ADDITIONS}" DELETIONS="${DELETIONS}" CHANGED_FILES="${CHANGED_FILES}" \
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = process.env.CI_VALIDATION_DIR;
          const artifactsUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts`;
          const FAILURE_PATTERNS = [
            /(?:^\s*\d+\)|^\s*Failures:|^Failure\/Error:|No examples found|uninitialized constant|NameError|NoMethodError|ActiveRecord::|PG::|permission denied|SyntaxError|LoadError|undefined method|expected\b|got\b|RuntimeError)/mi,
          ];

          function compact(value) {
            return `${value ?? ''}`.replace(/\s+/g, ' ').trim();
          }

          function extractFailureLines(filePath, status) {
            if (status === 'passed') return [];
            if (!filePath || !fs.existsSync(filePath)) return [];
            const lines = fs.readFileSync(filePath, 'utf8').split(/\r?\n/);
            const locationPattern = /\b(?:\.\/)?(?:app|spec)\/[A-Za-z0-9_./-]+\.rb:\d+\b/;
            const locationMatches = lines.filter((line) => locationPattern.test(line)).map(compact).filter(Boolean);
            if (locationMatches.length > 0) return locationMatches.slice(0, 10);
            const matched = lines.filter((line) => FAILURE_PATTERNS.some((pattern) => pattern.test(line))).map(compact).filter(Boolean);
            if (matched.length > 0) return matched.slice(0, 10);
            return lines.slice(-10).map(compact).filter(Boolean);
          }

          const suites = fs.readFileSync(`${dir}/suite-results.jsonl`, 'utf8')
            .trim()
            .split(/\n/)
            .filter(Boolean)
            .map((line) => {
              const suite = JSON.parse(line);
              const artifactPath = suite.artifact ? path.join(process.cwd(), suite.artifact) : '';
              const failures = extractFailureLines(artifactPath, suite.status);
              return {
                ...suite,
                failures,
                artifact_url: suite.artifact ? `${artifactsUrl} (${suite.artifact})` : '',
              };
            });

          const sstDiffRaw = fs.existsSync(process.env.SST_DIFF_ARTIFACT) ? fs.readFileSync(process.env.SST_DIFF_ARTIFACT, 'utf8') : '';
          const changedFiles = (process.env.CHANGED_FILES || '').split(/\r?\n/).map((entry) => entry.trim()).filter(Boolean);
          const input = {
            commitSummary: process.env.COMMIT_SUMMARY,
            commitCount: Number(process.env.COMMIT_COUNT || 0),
            contributors: (process.env.CONTRIBUTORS || '').split(',').map((entry) => entry.trim()).filter(Boolean),
            changeset: {
              summary: process.env.COMMIT_SUMMARY,
              filesChanged: Number(process.env.FILES_CHANGED || 0),
              additions: Number(process.env.ADDITIONS || 0),
              deletions: Number(process.env.DELETIONS || 0),
            },
            riskProfile: {
              changedFiles,
              changedFilesCount: changedFiles.length,
            },
            runContext: {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              eventName: process.env.GITHUB_EVENT_NAME,
              actor: process.env.GITHUB_ACTOR,
              prNumber: process.env.PR_NUMBER,
              prTitle: process.env.PR_TITLE,
              headRef: process.env.PR_HEAD_REF,
              baseRef: process.env.PR_BASE_REF,
              headSha: process.env.PR_HEAD_SHA,
              baseSha: process.env.PR_BASE_SHA,
              repository: process.env.GITHUB_REPOSITORY,
              artifactsUrl,
            },
            suites,
            sstRefresh: {
              status: process.env.SST_REFRESH_STATUS,
              reason: process.env.SST_REFRESH_REASON,
              summary: process.env.SST_REFRESH_SUMMARY,
              artifact: process.env.SST_REFRESH_ARTIFACT,
            },
            sstDiff: {
              status: process.env.SST_DIFF_STATUS,
              reason: process.env.SST_DIFF_REASON,
              summary: process.env.SST_DIFF_SUMMARY,
              artifact: process.env.SST_DIFF_ARTIFACT,
              rawText: sstDiffRaw,
            },
            releaseGates: [
              { name: 'deploy_control', status: 'passed', summary: 'deploy remains operator-driven and separate from advisory CI' },
              { name: 'legacy_runtime', status: 'passed', summary: 'current production host is not mutated by this workflow' },
              { name: 'sst_stage', status: process.env.SST_STAGE === 'dev' ? 'passed' : 'warning', summary: `sst evidence stage is ${process.env.SST_STAGE || 'unset'}` },
            ],
          };
          fs.writeFileSync(`${dir}/validation-input.json`, `${JSON.stringify(input, null, 2)}\n`);
          NODE

      - name: Render validation report
        if: always()
        run: node scripts/ci/validation-report.mjs --input "${CI_VALIDATION_DIR}/validation-input.json" --out-dir "${CI_VALIDATION_DIR}"

      - name: Upload validation report artifact
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: gala-ci-${{ github.run_id }}
          path: tmp/ci-validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Post final advisory status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          node scripts/ci/post-commit-status.mjs \
            --report "${CI_VALIDATION_DIR}/validation-report.json" \
            --target-url "${REPORT_URL}"

      - name: ci summary
        if: always()
        run: |
          if [[ -f "${CI_VALIDATION_DIR}/validation-report.txt" ]]; then
            {
              echo '```text'
              cat "${CI_VALIDATION_DIR}/validation-report.txt"
              echo '```'
            } > "$GITHUB_STEP_SUMMARY"
          fi
