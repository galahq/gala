name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gala_test
          POSTGRES_USER: gala
          POSTGRES_PASSWORD: alpine
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://gala:alpine@127.0.0.1:5432/gala_test
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libmagickcore-dev \
            libmagickwand-dev \
            libffi-dev \
            libvips \
            libssl-dev \
            postgresql-client-16

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.3
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile test assets
        run: bundle exec rails shakapacker:compile

      - name: Prepare Rails test database
        run: bundle exec rails db:prepare

      - name: Rails tests
        run: bundle exec rspec --tag '~type:feature'

      - name: JavaScript tests
        run: pnpm test
