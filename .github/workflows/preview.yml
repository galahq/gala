name: Preview AWS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to preview
        default: main
        required: true
        type: string
      dry_run:
        description: Preview infrastructure changes without deploying
        required: true
        type: boolean
        default: true
      user_data:
        description: Optional comma-separated approved dev ops hooks
        required: false
        default: ""
      container_architecture:
        description: ECS task and Docker image architecture
        required: true
        type: choice
        default: arm64
        options:
          - x86_64
          - arm64

concurrency:
  group: gala-preview-${{ github.event.pull_request.number || github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ${{ github.event.inputs.container_architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment: dev
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: dev
      GALA_DOMAIN_NAME: learngala.dev
      GALA_STATIC_ASSETS_BUCKET: gala-static-assets-353760060567
      GALA_RELEASE_RETAIN_COUNT: "10"
      GALA_PRODUCTION_DOCKERFILE: Dockerfile.production
      GALA_PRODUCTION_BASE_IMAGE_X86_64: 353760060567.dkr.ecr.us-west-2.amazonaws.com/gala-production-base:ruby4.0.3-bookworm-pg17-runtime-v1
      GALA_PRODUCTION_BASE_IMAGE_ARM64: 353760060567.dkr.ecr.us-west-2.amazonaws.com/gala-production-base:ruby4.0.3-bookworm-pg17-runtime-v1-arm64
      GALA_CONTAINER_ARCHITECTURE: ${{ github.event.inputs.container_architecture }}
      GALA_MAX_IMAGE_SIZE_BYTES: "1500000000"
      GALA_ENABLE_CUSTOM_DOMAIN: "true"
      GALA_CLOUDFLARE_PROXY: "false"
      GALA_IMMUTABLE_CLOUDFRONT: "true"
      RETAINED_SECRET_KEYS: RAILS_MASTER_KEY SECRET_KEY_BASE SES_SMTP_USERNAME SES_SMTP_PASSWORD MAPBOX_ACCESS_TOKEN LTI_KEY LTI_SECRET
      SEED_DUMP_S3_URI: ${{ secrets.GALA_SEED_DUMP_S3_URI }}
      USER_DATA: ${{ github.event.inputs.user_data || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Authorize contributor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actor="${{ github.triggering_actor }}"
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" --jq '.permission' 2>/dev/null || echo none)"

          case "$permission" in
            admin|maintain|write)
              echo "Authorized contributor: ${actor}"
              ;;
            *)
              echo "Refusing preview deploy: ${actor} has repository permission '${permission}', expected write/maintain/admin."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Build preview metadata
        id: meta
        run: |
          set -euo pipefail

          branch="${{ github.event.inputs.branch }}"
          dry_run="${{ github.event.inputs.dry_run }}"

          short_sha="$(git rev-parse --short=8 HEAD)"
          build_date="$(date -u +'%Y%m%d%H%M%S')"
          release_id="${GITHUB_RUN_ID}.${build_date}.${short_sha}"
          branch_slug="$(printf '%s' "${branch}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^$/preview/; s/^(.{1,48}).*$/\1/')"
          preview_host="${branch_slug}.dev.${GALA_DOMAIN_NAME}"
          preview_url="https://${preview_host}"
          asset_prefix="releases/dev/${release_id}"
          release_tag="preview.${release_id}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"

          {
            echo "GALA_RELEASE_ID=${release_id}"
            echo "GALA_ASSET_PREFIX=${asset_prefix}"
            echo "GALA_PREVIEW_HOST=${preview_host}"
            echo "GALA_BASE_URL=${preview_url}"
            echo "GALA_RELEASE_URL=${release_url}"
            echo "RELEASE=${release_tag}"
          } >> "$GITHUB_ENV"

          {
            echo "branch=${branch}"
            echo "dry_run=${dry_run}"
            echo "preview_url=${preview_url}"
            echo "release_id=${release_id}"
            echo "asset_prefix=${asset_prefix}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate preview inputs
        run: |
          set -euo pipefail
          if [[ -n "${USER_DATA}" ]]; then
            echo "::add-mask::${USER_DATA}"
          fi

          forbidden='(^|[[:space:]])(DATABASE_URL|REDIS_HOST|REDIS_URL|HEROKU_POSTGRESQL_[A-Z0-9_]+_URL|CACHE_URL)([[:space:]]|$)'
          if [[ "${RETAINED_SECRET_KEYS}" =~ $forbidden ]]; then
            echo "Refusing preview deploy: retained_secret_keys includes a Heroku database/cache connection key."
            exit 1
          fi

          if [[ -n "${USER_DATA}" && "${USER_DATA}" =~ (DATABASE_URL|REDIS_URL|AWS_SECRET|SECRET_KEY|PASSWORD=|TOKEN=|PRIVATE_KEY) ]]; then
            echo "Refusing preview deploy: user_data must not contain secret-looking values."
            exit 1
          fi

          if [[ -n "${SEED_DUMP_S3_URI}" && ! "${SEED_DUMP_S3_URI}" =~ ^s3:// ]]; then
            echo "Refusing preview deploy: GALA_SEED_DUMP_S3_URI must be an s3:// URI when provided."
            exit 1
          fi

          if [[ "${GALA_CONTAINER_ARCHITECTURE}" != "x86_64" && "${GALA_CONTAINER_ARCHITECTURE}" != "arm64" ]]; then
            echo "Refusing preview deploy: GALA_CONTAINER_ARCHITECTURE must be x86_64 or arm64."
            exit 1
          fi

          case "${GALA_CONTAINER_ARCHITECTURE}" in
            x86_64)
              production_base_image="${GALA_PRODUCTION_BASE_IMAGE_X86_64}"
              ;;
            arm64)
              production_base_image="${GALA_PRODUCTION_BASE_IMAGE_ARM64}"
              ;;
          esac

          if [[ -z "${production_base_image}" ]]; then
            echo "Refusing preview deploy: no production base image configured for ${GALA_CONTAINER_ARCHITECTURE}."
            exit 1
          fi

          echo "GALA_PRODUCTION_BASE_IMAGE=${production_base_image}" >> "$GITHUB_ENV"
          echo "Selected production base image for ${GALA_CONTAINER_ARCHITECTURE}: ${production_base_image}"

      - name: Verify AWS identity
        run: AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" aws sts get-caller-identity | cat

      - name: Deploy dev preview
        run: |
          set -euo pipefail
          args=(
            --branch "${{ steps.meta.outputs.branch }}" \
            --stage dev \
            --release-id "${GALA_RELEASE_ID}" \
            --asset-prefix "${GALA_ASSET_PREFIX}" \
            --seed-dump-s3-uri "${SEED_DUMP_S3_URI}" \
            --user-data "${USER_DATA}"
          )

          if [[ "${{ steps.meta.outputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          AWS_REGION="${AWS_REGION}" SST_STAGE=dev bash scripts/deploy-sst.sh "${args[@]}"

      - name: Comment on pull request
        if: steps.meta.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
          PREVIEW_BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          set -euo pipefail
          pr_number="${{ github.event.pull_request.number }}"
          if [[ -z "${pr_number}" ]]; then
            pr_number="$(gh pr list --head "${PREVIEW_BRANCH}" --state open --json number --jq '.[0].number // empty' || true)"
          fi

          {
            echo "Preview environment is live: ${PREVIEW_URL}"
            echo
            echo "SST stage: dev"
            echo "Release ID: ${RELEASE_ID}"
          } > preview-comment.md

          if [[ -n "${pr_number}" ]]; then
            gh pr comment "${pr_number}" --body-file preview-comment.md
          else
            cat preview-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preview summary
        if: always()
        run: |
          {
            echo "## Preview AWS"
            echo
            echo "- Branch: ${{ steps.meta.outputs.branch }}"
            echo "- Stage: dev"
            echo "- Dry run: ${{ steps.meta.outputs.dry_run }}"
            echo "- Preview URL: ${{ steps.meta.outputs.preview_url }}"
            echo "- Release ID: ${GALA_RELEASE_ID:-not-created}"
            echo "- Asset prefix: ${GALA_ASSET_PREFIX:-not-created}"
            echo "- Container architecture: ${GALA_CONTAINER_ARCHITECTURE}"
            echo "- Production base image: ${GALA_PRODUCTION_BASE_IMAGE:-not-selected}"
            echo "- Release tag: ${{ steps.meta.outputs.release_tag }}"
            echo "- PR comment: posted when an open PR exists for the branch and dry_run is false"
            echo "- Automatic PR trigger: disabled; this workflow is manual workflow_dispatch only"
          } >> "$GITHUB_STEP_SUMMARY"
