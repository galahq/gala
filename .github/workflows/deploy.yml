name: deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Durable target stage
        required: true
        type: choice
        default: dev
        options: [dev, production]
      user_data:
        description: "Action: blank, promote:vN, rollback[:vN], infra:diff, or infra:apply:PLAN_ID"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-${{ inputs.stage == 'production' && 'production' || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.stage == 'production' && 'production' || 'dev' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: ${{ inputs.stage }}
      USER_DATA: ${{ inputs.user_data }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GITHUB_SHA: ${{ github.sha }}
      GALA_RAPID_RELEASE: "true"
      GALA_DOMAIN_NAME: learngala.dev
      GALA_STATIC_ASSETS_BUCKET: gala-static-assets-353760060567
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Authorize operator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actor='${{ github.triggering_actor }}'
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" --jq .permission 2>/dev/null || echo none)"
          case "$permission" in admin|maintain|write) ;; *) exit 1 ;; esac
          if [[ "${SST_STAGE}" == production && "$permission" != admin && "$permission" != maintain ]]; then
            echo 'Production requires admin or maintain permission.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Resolve exact target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number // empty')"
          effective_stage="${SST_STAGE}"
          url="https://dev.learngala.dev"
          if [[ "${SST_STAGE}" == production ]]; then
            url="https://learngala.dev"
          elif [[ -n "$pr_number" ]]; then
            effective_stage="pr-${pr_number}"
            url="https://pr-${pr_number}.dev.learngala.dev"
          fi
          echo "GALA_EFFECTIVE_STAGE=${effective_stage}" >> "$GITHUB_ENV"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: bash scripts/deploy-sst.sh --branch "${GITHUB_REF_NAME}" --stage "${SST_STAGE}" --user-data "${USER_DATA}"

      - name: Comment verified preview URL
        if: success() && steps.target.outputs.pr_number != '' && inputs.user_data == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.target.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Preview environment is live: ${PREVIEW_URL}"

      - name: Summary
        if: always()
        run: |
          {
            echo '## deploy'
            echo "- Stage: ${GALA_EFFECTIVE_STAGE:-${SST_STAGE}}"
            echo "- Action: ${USER_DATA:-release}"
            echo "- Canonical version: v${GITHUB_RUN_NUMBER}"
            echo "- URL: ${{ steps.target.outputs.url }}"
            echo '- Architecture: arm64'
            echo '- Heroku, msc-gala ownership, and SES: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
