name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        required: true
        default: main
      stage:
        description: SST stage to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production
      action:
        description: Deploy or remove the selected stage
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - remove

concurrency:
  group: gala-${{ github.event.inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Refuse production removal
        if: github.event.inputs.stage == 'production' && github.event.inputs.action == 'remove'
        run: |
          echo "Refusing to remove production from CI."
          exit 1

      - name: Update script defaults for branch and stage
        run: |
          echo "Deploying branch: ${{ github.event.inputs.branch }}"
          echo "Stage: ${{ github.event.inputs.stage }}"
          echo "Action: ${{ github.event.inputs.action }}"

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install SST providers
        working-directory: infra
        run: npx sst install

      - name: Verify AWS identity
        run: aws sts get-caller-identity | cat

      - name: Deploy or remove with SST script
        run: |
          bash scripts/deploy-sst.sh \
            --branch "${{ github.event.inputs.branch }}" \
            --stage "${{ github.event.inputs.stage }}" \
            --action "${{ github.event.inputs.action }}"
