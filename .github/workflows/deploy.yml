name: deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      stage:
        description: Durable target stage
        required: true
        type: choice
        default: dev
        options: [dev, production]
      user_data:
        description: "Action: blank, infra:diff, infra:apply, promote:vN, or rollback[:vN]"
        required: false
        default: ""
        type: string

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: dev
      GALA_EFFECTIVE_STAGE: pr-${{ github.event.pull_request.number }}
      USER_DATA: ""
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - run: npm ci --prefix infra --prefer-offline --no-audit --no-fund

      - name: Deploy exact preview stage
        run: bash scripts/deploy-sst.sh --stage dev

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.dev.learngala.dev
        run: |
          gh pr comment "$PR_NUMBER" --body "Preview environment is live: ${PREVIEW_URL}"

  durable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: durable-${{ inputs.stage }}
      cancel-in-progress: false
    environment: ${{ inputs.stage == 'production' && 'production' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: ${{ inputs.stage }}
      GALA_EFFECTIVE_STAGE: ${{ inputs.stage }}
      USER_DATA: ${{ inputs.user_data }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GITHUB_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Authorize operator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_TRIGGERING_ACTOR}/permission" --jq .permission 2>/dev/null || echo none)"
          case "$permission" in admin|maintain|write) ;; *) exit 1 ;; esac
          if [[ "${SST_STAGE}" == production && "$permission" != admin && "$permission" != maintain ]]; then exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - run: npm ci --prefix infra --prefer-offline --no-audit --no-fund

      - name: Run operator action
        run: bash scripts/deploy-sst.sh --stage "$SST_STAGE" --user-data "$USER_DATA"
