name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        default: main
        required: true
        type: string
      stage:
        description: SST stage to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production
      dry_run:
        description: Preview infrastructure changes without deploying
        required: true
        type: boolean
        default: true
      invalidate_cache:
        description: Invalidate CloudFront after a successful deploy
        required: true
        type: boolean
        default: false
      user_data:
        description: Optional comma-separated approved ops hooks
        required: false
        default: ""
      release_id:
        description: Optional immutable release/artifact ID
        required: false
        default: ""
        type: string
      container_architecture:
        description: ECS task and Docker image architecture
        required: true
        type: choice
        default: arm64
        options:
          - x86_64
          - arm64
      confirmation:
        description: Type "promote production <branch-or-release_id>" for production mutation
        required: false
        default: ""
        type: string

concurrency:
  group: gala-${{ github.event.inputs.stage }}-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.stage }}
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: ${{ github.event.inputs.stage }}
      GALA_DOMAIN_NAME: learngala.dev
      GALA_STATIC_ASSETS_BUCKET: gala-static-assets-353760060567
      GALA_RELEASE_RETAIN_COUNT: "10"
      GALA_PRODUCTION_DOCKERFILE: Dockerfile.production
      GALA_PRODUCTION_BASE_IMAGE_X86_64: 353760060567.dkr.ecr.us-west-2.amazonaws.com/gala-production-base:ruby4.0.3-bookworm-pg17-runtime-v1
      GALA_PRODUCTION_BASE_IMAGE_ARM64: 353760060567.dkr.ecr.us-west-2.amazonaws.com/gala-production-base:ruby4.0.3-bookworm-pg17-runtime-v1-arm64
      GALA_CONTAINER_ARCHITECTURE: ${{ github.event.inputs.container_architecture }}
      GALA_MAX_IMAGE_SIZE_BYTES: "1500000000"
      GALA_ENABLE_CUSTOM_DOMAIN: "true"
      GALA_CLOUDFLARE_PROXY: "false"
      GALA_IMMUTABLE_CLOUDFRONT: "true"
      GALA_ECS_ONLY_DEPLOY: ${{ github.event.inputs.stage == 'production' && github.event.inputs.container_architecture != 'arm64' && 'true' || 'false' }}
      RETAINED_SECRET_KEYS: RAILS_MASTER_KEY SECRET_KEY_BASE SES_SMTP_USERNAME SES_SMTP_PASSWORD MAPBOX_ACCESS_TOKEN LTI_KEY LTI_SECRET
      SEED_DUMP_S3_URI: ${{ secrets.GALA_SEED_DUMP_S3_URI }}
      USER_DATA: ${{ github.event.inputs.user_data }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Authorize contributor
        if: github.event.inputs.stage == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actor="${{ github.triggering_actor }}"
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" --jq '.permission' 2>/dev/null || echo none)"

          case "$permission" in
            admin|maintain|write)
              echo "Authorized contributor: ${actor}"
              ;;
            *)
              echo "Refusing dev deploy: ${actor} has repository permission '${permission}', expected write/maintain/admin."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Validate production operator
        if: github.event.inputs.stage == 'production'
        env:
          OPERATOR_ACTOR: ${{ github.triggering_actor }}
          SOURCE_REF: ${{ github.event.inputs.branch }}
          RELEASE_ID_INPUT: ${{ github.event.inputs.release_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          set -euo pipefail
          source scripts/ops/operator-common.sh

          operator_require_codeowner_actor "${OPERATOR_ACTOR}"
          operator_reject_secret_like_input branch "${SOURCE_REF}"
          operator_reject_secret_like_input release_id "${RELEASE_ID_INPUT}"

          target="${RELEASE_ID_INPUT:-$SOURCE_REF}"
          operator_require_confirmation production promote "${target}" "${DRY_RUN}" "${CONFIRMATION}"

      - name: Build release metadata
        id: meta
        env:
          RELEASE_ID_INPUT: ${{ github.event.inputs.release_id }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=8 HEAD)"
          build_date="$(date -u +'%Y%m%d%H%M%S')"
          release_id="${RELEASE_ID_INPUT:-${GITHUB_RUN_ID}.${build_date}.${short_sha}}"
          branch_slug="$(printf '%s' "${{ github.event.inputs.branch }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^$/preview/; s/^(.{1,48}).*$/\1/')"
          if [[ "${SST_STAGE}" == "production" ]]; then
            preview_host="${GALA_DOMAIN_NAME}"
            release_tag="production.${release_id}"
          else
            preview_host="${branch_slug}.dev.${GALA_DOMAIN_NAME}"
            release_tag="preview.${release_id}"
          fi
          base_url="https://${preview_host}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"
          asset_prefix="releases/${SST_STAGE}/${release_id}"

          {
            echo "GALA_RELEASE_ID=${release_id}"
            echo "GALA_ASSET_PREFIX=${asset_prefix}"
            echo "GALA_PREVIEW_HOST=${preview_host}"
            echo "GALA_BASE_URL=${base_url}"
            echo "GALA_RELEASE_URL=${release_url}"
            echo "RELEASE=${release_tag}"
          } >> "$GITHUB_ENV"

          {
            echo "release_id=${release_id}"
            echo "preview_url=${base_url}"
            echo "asset_prefix=${asset_prefix}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate deploy inputs
        run: |
          set -euo pipefail
          if [[ -n "${USER_DATA}" ]]; then
            echo "::add-mask::${USER_DATA}"
          fi

          forbidden='(^|[[:space:]])(DATABASE_URL|REDIS_HOST|REDIS_URL|HEROKU_POSTGRESQL_[A-Z0-9_]+_URL|CACHE_URL)([[:space:]]|$)'
          if [[ "${RETAINED_SECRET_KEYS}" =~ $forbidden ]]; then
            echo "Refusing deploy: retained_secret_keys includes a Heroku database/cache connection key."
            exit 1
          fi

          if [[ -n "${USER_DATA}" && "${USER_DATA}" =~ (DATABASE_URL|REDIS_URL|AWS_SECRET|SECRET_KEY|PASSWORD=|TOKEN=|PRIVATE_KEY) ]]; then
            echo "Refusing deploy: user_data must not contain secret-looking values."
            exit 1
          fi

          if [[ -n "${SEED_DUMP_S3_URI}" && ! "${SEED_DUMP_S3_URI}" =~ ^s3:// ]]; then
            echo "Refusing deploy: GALA_SEED_DUMP_S3_URI must be an s3:// URI when provided."
            exit 1
          fi

          if [[ "${GALA_CONTAINER_ARCHITECTURE}" != "x86_64" && "${GALA_CONTAINER_ARCHITECTURE}" != "arm64" ]]; then
            echo "Refusing deploy: GALA_CONTAINER_ARCHITECTURE must be x86_64 or arm64."
            exit 1
          fi

          case "${GALA_CONTAINER_ARCHITECTURE}" in
            x86_64)
              production_base_image="${GALA_PRODUCTION_BASE_IMAGE_X86_64}"
              ;;
            arm64)
              production_base_image="${GALA_PRODUCTION_BASE_IMAGE_ARM64}"
              ;;
          esac

          if [[ -z "${production_base_image}" ]]; then
            echo "Refusing deploy: no production base image configured for ${GALA_CONTAINER_ARCHITECTURE}."
            exit 1
          fi

          echo "GALA_PRODUCTION_BASE_IMAGE=${production_base_image}" >> "$GITHUB_ENV"
          echo "Selected production base image for ${GALA_CONTAINER_ARCHITECTURE}: ${production_base_image}"

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install SST providers
        working-directory: infra
        run: npx sst install

      - name: Verify AWS identity
        run: AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" aws sts get-caller-identity | cat

      - name: Set up QEMU for ARM64 Docker builds
        if: env.GALA_CONTAINER_ARCHITECTURE == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Deploy with SST script
        run: |
          set -euo pipefail
          args=(
            --branch "${{ github.event.inputs.branch }}" \
            --stage "${SST_STAGE}" \
            --release-id "${GALA_RELEASE_ID}" \
            --asset-prefix "${GALA_ASSET_PREFIX}" \
            --seed-dump-s3-uri "${SEED_DUMP_S3_URI}" \
            --user-data "${USER_DATA}"
          )

          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ "${{ github.event.inputs.invalidate_cache }}" == "true" ]]; then
            args+=(--invalidate-cache)
          fi

          AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" bash scripts/deploy-sst.sh "${args[@]}"

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy AWS"
            echo
            echo "- Branch: ${{ github.event.inputs.branch }}"
            echo "- Stage: ${SST_STAGE}"
            echo "- Dry run: ${{ github.event.inputs.dry_run }}"
            echo "- Base URL: ${{ steps.meta.outputs.preview_url }}"
            echo "- Release ID: ${GALA_RELEASE_ID:-not-created}"
            echo "- Asset prefix: ${GALA_ASSET_PREFIX:-not-created}"
            echo "- Container architecture: ${GALA_CONTAINER_ARCHITECTURE}"
            echo "- Production base image: ${GALA_PRODUCTION_BASE_IMAGE:-not-selected}"
            echo "- Cache invalidation requested: ${{ github.event.inputs.invalidate_cache }}"
            echo "- Custom domain mutation: ${GALA_ENABLE_CUSTOM_DOMAIN}"
            echo "- ECS-only rollout: ${GALA_ECS_ONLY_DEPLOY}"
            echo "- Heroku production: out of scope"
          } >> "$GITHUB_STEP_SUMMARY"
