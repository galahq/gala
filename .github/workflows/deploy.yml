name: deploy # UI naming convention: lowercase

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Target stage
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production
      user_data:
        description: Optional site-operator action data for promotion, migration, rollback, or approved hooks
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.stage }}-${{ github.event.inputs.user_data == 'diff' && 'infra-diff' || 'deploy' }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: ${{ github.event.inputs.stage }}
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: ${{ github.event.inputs.stage }}
      GALA_DOMAIN_NAME: learngala.dev
      GALA_STATIC_ASSETS_BUCKET: gala-static-assets-353760060567
      GALA_RELEASE_RETAIN_COUNT: "10"
      GALA_RELEASE_VERSION: v2.9.9
      GALA_PRODUCTION_DOCKERFILE: Dockerfile.production
      GALA_PRODUCTION_BASE_IMAGE: 353760060567.dkr.ecr.us-west-2.amazonaws.com/gala-production-base:ruby4.0.3-bookworm-pg17-runtime-v1-arm64
      GALA_CONTAINER_ARCHITECTURE: arm64
      GALA_MAX_IMAGE_SIZE_BYTES: "1500000000"
      GALA_ENABLE_CUSTOM_DOMAIN: "true"
      GALA_CLOUDFLARE_PROXY: "false"
      GALA_IMMUTABLE_CLOUDFRONT: "true"
      GALA_ECS_ONLY_DEPLOY: "false"
      RETAINED_SECRET_KEYS: RAILS_MASTER_KEY SECRET_KEY_BASE SES_SMTP_USERNAME SES_SMTP_PASSWORD MAPBOX_ACCESS_TOKEN LTI_KEY LTI_SECRET
      SEED_DUMP_S3_URI: ${{ secrets.GALA_SEED_DUMP_S3_URI }}
      USER_DATA: ${{ github.event.inputs.user_data }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Authorize dev operator
        if: github.event.inputs.stage == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actor="${{ github.triggering_actor }}"
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" --jq '.permission' 2>/dev/null || echo none)"

          case "$permission" in
            admin|maintain|write)
              echo "Authorized dev operator: ${actor}"
              ;;
            *)
              echo "Refusing dev deploy: ${actor} has repository permission '${permission}', expected write/maintain/admin."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Validate deploy operator
        env:
          OPERATOR_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          source scripts/ops/operator-common.sh

          if [[ "${SST_STAGE}" == "production" ]]; then
            operator_require_codeowner_actor "${OPERATOR_ACTOR}"
          fi

          if [[ -n "${USER_DATA}" ]]; then
            echo "::add-mask::${USER_DATA}"
          fi

          operator_reject_secret_like_input user_data "${USER_DATA}"

          forbidden='(^|[[:space:]])(DATABASE_URL|REDIS_HOST|REDIS_URL|HEROKU_POSTGRESQL_[A-Z0-9_]+_URL|CACHE_URL)([[:space:]]|$)'
          if [[ "${RETAINED_SECRET_KEYS}" =~ $forbidden ]]; then
            echo "Refusing deploy: retained_secret_keys includes a Heroku database/cache connection key."
            exit 1
          fi

          if [[ -n "${SEED_DUMP_S3_URI}" && ! "${SEED_DUMP_S3_URI}" =~ ^s3:// ]]; then
            echo "Refusing deploy: GALA_SEED_DUMP_S3_URI must be an s3:// URI when provided."
            exit 1
          fi

          echo "Selected GitHub runner: ubuntu-24.04-arm"
          echo "Selected container architecture: ${GALA_CONTAINER_ARCHITECTURE}"
          echo "Selected production base image: ${GALA_PRODUCTION_BASE_IMAGE}"

      - name: Build release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=8 HEAD)"
          build_date="$(date -u +'%Y%m%d%H%M%S')"
          pr_number="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number // empty' || true)"
          release_id="${GITHUB_RUN_ID}.${build_date}.${short_sha}"
          branch_slug="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^$/preview/; s/^(.{1,48}).*$/\1/')"
          if [[ "${SST_STAGE}" == "production" ]]; then
            app_host="${GALA_DOMAIN_NAME}"
            release_tag="production.${release_id}"
          else
            app_host="${branch_slug}.dev.${GALA_DOMAIN_NAME}"
            release_tag="preview.${release_id}"
          fi
          base_url="https://${app_host}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"
          asset_prefix="releases/${SST_STAGE}/${release_id}"

          {
            echo "GALA_RELEASE_ID=${release_id}"
            echo "GALA_ASSET_PREFIX=${asset_prefix}"
            echo "GALA_PREVIEW_HOST=${app_host}"
            echo "GALA_BASE_URL=${base_url}"
            echo "GALA_RELEASE_URL=${release_url}"
            echo "GALA_PREVIEW_PR_NUMBER=${pr_number}"
            echo "RELEASE=${release_tag}"
          } >> "$GITHUB_ENV"

          {
            echo "release_id=${release_id}"
            echo "base_url=${base_url}"
            echo "asset_prefix=${asset_prefix}"
            echo "release_tag=${release_tag}"
            echo "preview_pr_number=${pr_number}"
          } >> "$GITHUB_OUTPUT"

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install SST providers
        working-directory: infra
        run: npx sst install

      - name: Verify AWS identity
        run: AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" aws sts get-caller-identity | cat

      - name: Deploy with SST script
        id: deploy_mode
        run: |
          set -euo pipefail
          if [[ "${USER_DATA}" == "diff" ]]; then
            echo "Running infra-diff mode (sst diff dry run)."
            USER_DATA="" AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" bash scripts/deploy-sst.sh \
              --branch "${GITHUB_REF_NAME}" \
              --stage "${SST_STAGE}" \
              --release-id "${GALA_RELEASE_ID}" \
              --asset-prefix "${GALA_ASSET_PREFIX}" \
              --seed-dump-s3-uri "${SEED_DUMP_S3_URI}" \
              --dry-run
          else
            echo "Running deploy mode."
            AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" bash scripts/deploy-sst.sh \
              --branch "${GITHUB_REF_NAME}" \
              --stage "${SST_STAGE}" \
              --release-id "${GALA_RELEASE_ID}" \
              --asset-prefix "${GALA_ASSET_PREFIX}" \
              --seed-dump-s3-uri "${SEED_DUMP_S3_URI}" \
              --invalidate-cache \
              --user-data "${USER_DATA}"
          fi

      - name: Comment on pull request
        if: github.event.inputs.stage == 'dev' && github.event.inputs.user_data != 'diff'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.meta.outputs.base_url }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number // empty' || true)"

          {
            echo "Preview environment is live: ${PREVIEW_URL}"
            echo
            echo "SST stage: dev"
            echo "Release ID: ${RELEASE_ID}"
          } > preview-comment.md

          if [[ -n "${pr_number}" ]]; then
            gh pr comment "${pr_number}" --body-file preview-comment.md
          else
            cat preview-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create production GitHub release
        if: github.event.inputs.stage == 'production' && github.event.inputs.user_data != 'diff'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          previous_tag="$(git tag --list 'production.*' --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)"
          if [[ -n "${previous_tag}" ]]; then
            commit_args=("${previous_tag}..HEAD")
          else
            commit_args=(--max-count=50 HEAD)
          fi

          commits="$(git log --pretty=format:'- %s (%h)' "${commit_args[@]}" || true)"
          title="Production release $(date -u +'%Y-%m-%d')"

          {
            echo "## ${title}"
            echo
            if [[ -n "${commits}" ]]; then
              echo "${commits}"
            else
              echo "- No commits found for release notes range."
            fi
          } > release-notes.md

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --target "$(git rev-parse HEAD)" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --target "$(git rev-parse HEAD)" \
              --title "${title}" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: deploy summary
        if: always()
        run: |
          {
            echo "## deploy"
            echo
            if [[ "${USER_DATA}" == "diff" ]]; then
              echo "- Mode: infra-diff"
            else
              echo "- Mode: deploy"
            fi
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- Stage: ${SST_STAGE}"
            echo "- Base URL: ${{ steps.meta.outputs.base_url }}"
            echo "- Release ID: ${GALA_RELEASE_ID:-not-created}"
            echo "- Asset prefix: ${GALA_ASSET_PREFIX:-not-created}"
            echo "- GitHub runner: ubuntu-24.04-arm"
            echo "- Container architecture: ${GALA_CONTAINER_ARCHITECTURE}"
            echo "- Production base image: ${GALA_PRODUCTION_BASE_IMAGE}"
            echo "- User data supplied: $([[ -n "${USER_DATA}" ]] && echo yes || echo no)"
            echo "- Heroku production: out of scope"
          } >> "$GITHUB_STEP_SUMMARY"
