name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        required: true
        default: main
      stage:
        description: SST stage to deploy
        required: true
        type: choice
        default: production
        options:
          - dev
          - production
      action:
        description: Deploy or remove the selected stage
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - remove
      alb_base_url:
        description: Generated AWS ALB URL to use as BASE_URL for production validation
        required: false
        default: ""
      retained_secret_keys:
        description: Space-separated Heroku config keys approved for read-only retention; database/cache keys are refused
        required: false
        default: "RAILS_MASTER_KEY SECRET_KEY_BASE SES_SMTP_USERNAME SES_SMTP_PASSWORD MAPBOX_ACCESS_TOKEN LTI_KEY LTI_SECRET"
      seed_dump_s3_uri:
        description: Private S3 URI for db/sqldump/seed.dump used to initialize the AWS database
        required: false
        default: ""

concurrency:
  group: gala-${{ github.event.inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: ${{ github.event.inputs.stage }}
      ALB_BASE_URL: ${{ github.event.inputs.alb_base_url }}
      RETAINED_SECRET_KEYS: ${{ github.event.inputs.retained_secret_keys }}
      SEED_DUMP_S3_URI: ${{ github.event.inputs.seed_dump_s3_uri }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Refuse production removal
        if: github.event.inputs.stage == 'production' && github.event.inputs.action == 'remove'
        run: |
          echo "Refusing to remove production from CI."
          exit 1

      - name: Validate production deploy inputs
        run: |
          set -euo pipefail
          echo "Deploying branch: ${{ github.event.inputs.branch }}"
          echo "Stage: ${SST_STAGE}"
          echo "Action: ${{ github.event.inputs.action }}"

          if [[ "${SST_STAGE}" == "production" && "${{ github.event.inputs.action }}" == "deploy" && -z "${ALB_BASE_URL}" ]]; then
            echo "Warning: alb_base_url is empty. First deploy may create the ALB; rerun with the generated ALB URL before accepting route validation."
          fi

          forbidden='(^|[[:space:]])(DATABASE_URL|REDIS_HOST|REDIS_URL|HEROKU_POSTGRESQL_[A-Z0-9_]+_URL|CACHE_URL)([[:space:]]|$)'
          if [[ "${RETAINED_SECRET_KEYS}" =~ $forbidden ]]; then
            echo "Refusing deploy: retained_secret_keys includes a Heroku database/cache connection key."
            exit 1
          fi

          if [[ -n "${SEED_DUMP_S3_URI}" && ! "${SEED_DUMP_S3_URI}" =~ ^s3:// ]]; then
            echo "Refusing deploy: seed_dump_s3_uri must be an s3:// URI when provided."
            exit 1
          fi

      - name: Update script defaults for branch and stage
        run: |
          echo "Deploying branch: ${{ github.event.inputs.branch }}"
          echo "Stage: ${{ github.event.inputs.stage }}"
          echo "Action: ${{ github.event.inputs.action }}"

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install SST providers
        working-directory: infra
        run: npx sst install

      - name: Verify AWS identity
        run: AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" aws sts get-caller-identity | cat

      - name: Deploy or remove with SST script
        run: |
          AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" ALB_BASE_URL="${ALB_BASE_URL}" bash scripts/deploy-sst.sh \
            --branch "${{ github.event.inputs.branch }}" \
            --stage "${{ github.event.inputs.stage }}" \
            --action "${{ github.event.inputs.action }}" \
            --seed-dump-s3-uri "${SEED_DUMP_S3_URI}"
