name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        default: main
        required: true
        type: string
      stage:
        description: SST stage to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production
      dry_run:
        description: Preview infrastructure changes without deploying
        required: true
        type: boolean
        default: true
      invalidate_cache:
        description: Invalidate CloudFront after a successful deploy
        required: true
        type: boolean
        default: false
      user_data:
        description: Optional comma-separated approved ops hooks
        required: false
        default: ""

concurrency:
  group: gala-${{ github.event.inputs.stage }}-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.stage }}
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: ${{ github.event.inputs.stage }}
      GALA_DOMAIN_NAME: learngala.dev
      GALA_STATIC_ASSETS_BUCKET: gala-static-assets-353760060567
      GALA_RELEASE_RETAIN_COUNT: "10"
      GALA_PRODUCTION_DOCKERFILE: Dockerfile.production
      GALA_PRODUCTION_BASE_IMAGE: 353760060567.dkr.ecr.us-west-2.amazonaws.com/gala-production-base:ruby4.0.3-bookworm-pg17-runtime-v1
      GALA_MAX_IMAGE_SIZE_BYTES: "1500000000"
      GALA_ENABLE_CUSTOM_DOMAIN: "true"
      GALA_CLOUDFLARE_PROXY: "false"
      GALA_IMMUTABLE_CLOUDFRONT: "true"
      RETAINED_SECRET_KEYS: RAILS_MASTER_KEY SECRET_KEY_BASE SES_SMTP_USERNAME SES_SMTP_PASSWORD MAPBOX_ACCESS_TOKEN LTI_KEY LTI_SECRET
      SEED_DUMP_S3_URI: ${{ secrets.GALA_SEED_DUMP_S3_URI }}
      USER_DATA: ${{ github.event.inputs.user_data }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Authorize contributor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actor="${{ github.triggering_actor }}"
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" --jq '.permission' 2>/dev/null || echo none)"

          case "$permission" in
            admin|maintain|write)
              echo "Authorized contributor: ${actor}"
              ;;
            *)
              echo "Refusing deploy: ${actor} has repository permission '${permission}', expected write/maintain/admin."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Build release metadata
        id: meta
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=8 HEAD)"
          build_date="$(date -u +'%Y%m%d%H%M%S')"
          release_id="${GITHUB_RUN_ID}.${build_date}.${short_sha}"
          branch_slug="$(printf '%s' "${{ github.event.inputs.branch }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^$/preview/; s/^(.{1,48}).*$/\1/')"

          if [[ "${SST_STAGE}" == "production" ]]; then
            preview_host="${GALA_DOMAIN_NAME}"
            base_url="https://${GALA_DOMAIN_NAME}"
            release_tag="production.${release_id}"
          else
            preview_host="${branch_slug}.dev.${GALA_DOMAIN_NAME}"
            base_url="https://${preview_host}"
            release_tag="preview.${release_id}"
          fi

          asset_prefix="releases/${SST_STAGE}/${release_id}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"

          {
            echo "GALA_RELEASE_ID=${release_id}"
            echo "GALA_ASSET_PREFIX=${asset_prefix}"
            echo "GALA_PREVIEW_HOST=${preview_host}"
            echo "GALA_BASE_URL=${base_url}"
            echo "GALA_RELEASE_URL=${release_url}"
            echo "RELEASE=${release_tag}"
          } >> "$GITHUB_ENV"

          {
            echo "release_id=${release_id}"
            echo "preview_url=${base_url}"
            echo "release_tag=${release_tag}"
            echo "release_url=${release_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate deploy inputs
        run: |
          set -euo pipefail
          if [[ -n "${USER_DATA}" ]]; then
            echo "::add-mask::${USER_DATA}"
          fi

          forbidden='(^|[[:space:]])(DATABASE_URL|REDIS_HOST|REDIS_URL|HEROKU_POSTGRESQL_[A-Z0-9_]+_URL|CACHE_URL)([[:space:]]|$)'
          if [[ "${RETAINED_SECRET_KEYS}" =~ $forbidden ]]; then
            echo "Refusing deploy: retained_secret_keys includes a Heroku database/cache connection key."
            exit 1
          fi

          if [[ -n "${USER_DATA}" && "${USER_DATA}" =~ (DATABASE_URL|REDIS_URL|AWS_SECRET|SECRET_KEY|PASSWORD=|TOKEN=|PRIVATE_KEY) ]]; then
            echo "Refusing deploy: user_data must not contain secret-looking values."
            exit 1
          fi

          if [[ -n "${SEED_DUMP_S3_URI}" && ! "${SEED_DUMP_S3_URI}" =~ ^s3:// ]]; then
            echo "Refusing deploy: GALA_SEED_DUMP_S3_URI must be an s3:// URI when provided."
            exit 1
          fi

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install SST providers
        working-directory: infra
        run: npx sst install

      - name: Verify AWS identity
        run: AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" aws sts get-caller-identity | cat

      - name: Deploy with SST script
        run: |
          set -euo pipefail
          args=(
            --branch "${{ github.event.inputs.branch }}" \
            --stage "${{ github.event.inputs.stage }}" \
            --release-id "${GALA_RELEASE_ID}" \
            --asset-prefix "${GALA_ASSET_PREFIX}" \
            --seed-dump-s3-uri "${SEED_DUMP_S3_URI}" \
            --user-data "${USER_DATA}"
          )

          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ "${{ github.event.inputs.invalidate_cache }}" == "true" ]]; then
            args+=(--invalidate-cache)
          fi

          AWS_REGION="${AWS_REGION}" SST_STAGE="${SST_STAGE}" bash scripts/deploy-sst.sh "${args[@]}"

      - name: Create production GitHub release
        if: github.event.inputs.stage == 'production' && github.event.inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          previous_tag="$(git tag --list 'production.*' --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)"
          if [[ -n "${previous_tag}" ]]; then
            commit_args=("${previous_tag}..HEAD")
          else
            commit_args=(--max-count=50 HEAD)
          fi

          commits="$(git log --pretty=format:'- %s (%h)' "${commit_args[@]}" || true)"
          messages="$(git log --pretty=format:'%s%n%b' "${commit_args[@]}" | tr '[:upper:]' '[:lower:]' || true)"
          traits=()
          append_trait() {
            local trait="$1"
            for existing in "${traits[@]}"; do
              [[ "$existing" == "$trait" ]] && return
            done
            traits+=("$trait")
          }

          [[ "$messages" =~ (fix|bug|patch|repair) ]] && append_trait fix
          [[ "$messages" =~ (feat|feature|add|new) ]] && append_trait feature
          [[ "$messages" =~ (maint|chore|refactor|docs|deps) ]] && append_trait maintence
          [[ "$messages" =~ (sec|cve|vulnerab) ]] && append_trait security
          [[ "$messages" =~ (perf|latency|cache|speed) ]] && append_trait performance
          [[ "$messages" =~ (ops|deploy|infra|ci|cd|cloudflare|sst|aws) ]] && append_trait ops
          [[ "$messages" =~ (asset|image|s3|pack) ]] && append_trait asset
          [[ "$messages" =~ (design|ui|css|blueprint) ]] && append_trait design
          [[ "$messages" =~ (engineering|test|typing|types|architecture) ]] && append_trait engineering
          [[ "$messages" =~ (experiment|spike|preview) ]] && append_trait experiment
          [[ "$messages" =~ oembed ]] && append_trait oembed
          [[ "${#traits[@]}" -eq 0 ]] && append_trait misc

          trait_text="$(IFS=,; echo "${traits[*]}")"
          title="Production release $(date -u +'%Y-%m-%d') (${trait_text})"

          {
            echo "## ${title}"
            echo
            if [[ -n "${commits}" ]]; then
              echo "${commits}"
            else
              echo "- No commits found for release notes range."
            fi
          } > release-notes.md

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --target "$(git rev-parse HEAD)" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --target "$(git rev-parse HEAD)" \
              --title "${title}" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Comment on preview pull request
        if: github.event.inputs.stage == 'dev' && github.event.inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "${{ github.event.inputs.branch }}" --state open --json number --jq '.[0].number // empty' || true)"

          {
            echo "Preview environment is live: ${PREVIEW_URL}"
            echo
            echo "Release ID: ${RELEASE_ID}"
            echo "Promote with this workflow by selecting branch '${{ github.event.inputs.branch }}', stage 'production', and dry_run 'false'."
          } > preview-comment.md

          if [[ -n "${pr_number}" ]]; then
            gh pr comment "${pr_number}" --body-file preview-comment.md
          else
            cat preview-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deploy AWS"
            echo
            echo "- Branch: ${{ github.event.inputs.branch }}"
            echo "- Stage: ${{ github.event.inputs.stage }}"
            echo "- Dry run: ${{ github.event.inputs.dry_run }}"
            echo "- Release ID: ${GALA_RELEASE_ID:-not-created}"
            echo "- Preview URL: ${GALA_BASE_URL:-not-created}"
            echo "- Asset prefix: ${GALA_ASSET_PREFIX:-not-created}"
          } >> "$GITHUB_STEP_SUMMARY"
