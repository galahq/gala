name: deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Durable target stage
        required: true
        type: choice
        default: dev
        options: [dev, production]

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: durable-${{ inputs.stage }}
      cancel-in-progress: false
    environment: ${{ inputs.stage == 'production' && 'production' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      SST_STAGE: ${{ inputs.stage }}
      GALA_PRODUCTION_BASE_IMAGE: 353760060567.dkr.ecr.us-west-2.amazonaws.com/gala-production-base@sha256:bdc4c6229e8ebac5db35c0ca4ca98622662ca96f53e73b059cafef69099e7d61
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Authorize operator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_TRIGGERING_ACTOR}/permission" --jq .permission 2>/dev/null || echo none)"
          case "$permission" in admin|maintain|write) ;; *) exit 1 ;; esac
          if [[ "${SST_STAGE}" == production && "$permission" != admin && "$permission" != maintain ]]; then exit 1; fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::353760060567:role/gala_oidc_service_role
          aws-region: us-west-2

      - name: Install SST dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: infra

      - name: Deploy durable stage
        run: npx sst deploy --stage "$SST_STAGE"
        working-directory: infra
