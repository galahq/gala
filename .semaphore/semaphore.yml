version: v1.0
name: Continuous Integration
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2204

global_job_config:
  env_vars:
    - name: RAILS_ENV
      value: test
    - name: DATABASE_URL
      value: 'postgresql://postgres@localhost/test?encoding=utf8'

blocks:
  - name: Setup
    task:
      jobs:
        - name: Bundle & pnpm
          commands:
            - checkout
            
            # Setup Ruby
            - sem-version ruby 4.0.3
            - gem update --system 3.3.22 --no-document
            - gem install bundler:2.4.19 --no-document
            
            # Install system dependencies
            - echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
            - sudo apt-get update
            - sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" libmagickcore-dev libmagickwand-dev libffi-dev libvips libssl-dev postgresql-common

            # Bundle install with caching
            - BUNDLE_JOBS=4
            - BUNDLE_RETRY=3
            - bundle config set deployment true
            - bundle config set path vendor/bundle
            - cache restore gems-$SEMAPHORE_GIT_BRANCH-$(checksum Gemfile.lock)
            - bundle install
            - cache store gems-$SEMAPHORE_GIT_BRANCH-$(checksum Gemfile.lock) vendor/bundle
            
            # pnpm install with caching
            - sem-version node 24.15.0
            - npm install --global corepack@latest
            - corepack prepare pnpm@11.1.0 --activate
            - cache restore pnpm-store-$SEMAPHORE_GIT_BRANCH-$(checksum pnpm-lock.yaml)
            - pnpm install --frozen-lockfile
            - cache store pnpm-store-$SEMAPHORE_GIT_BRANCH-$(checksum pnpm-lock.yaml) node_modules

  - name: Tests
    task:
      prologue:
        commands:
          - checkout
          - sem-version ruby 4.0.3
          - sem-version node 24.15.0
          - npm install --global corepack@latest
          - corepack prepare pnpm@11.1.0 --activate
          - sem-service start postgres
          - cache restore gems-$SEMAPHORE_GIT_BRANCH-$(checksum Gemfile.lock)
          - cache restore pnpm-store-$SEMAPHORE_GIT_BRANCH-$(checksum pnpm-lock.yaml)
          - bundle install --deployment --path vendor/bundle
          - pnpm install --frozen-lockfile
          - cat /dev/null > config/database.yml
          - bundle exec rake db:drop db:create db:schema:load
          - bundle exec rake db:test:prepare
          
      jobs:
        - name: RSpec & Jest
          commands:
            - bundle exec rails assets:precompile
            - bundle exec rspec --exclude-pattern "spec/features/**/*_spec.rb" --format progress --color
            - pnpm test
            
        - name: Factory Bot Lint
          commands:
            - bundle exec rake factory_bot:lint
